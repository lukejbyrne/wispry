<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Member checkout | i don't type</title>
  <meta name="description" content="Private i don't type checkout for Skool members.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script defer data-domain="idonttype.com" src="https://plausible.io/js/script.file-downloads.outbound-links.tagged-events.js"></script>
  <style>
    :root {
      --ink: #0d0d0c;
      --paper: #f2f1ec;
      --muted: rgba(242, 241, 236, 0.68);
      --line: rgba(242, 241, 236, 0.16);
      --accent: oklch(66% 0.08 62);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      margin: 0;
      background:
        radial-gradient(circle at 80% 0%, oklch(66% 0.08 62 / 0.2), transparent 30%),
        var(--ink);
      color: var(--paper);
      line-height: 1.55;
    }

    main {
      width: min(760px, calc(100% - 40px));
      margin: 0 auto;
      padding: 76px 0;
    }

    a { color: inherit; }

    .back {
      display: inline-flex;
      margin-bottom: 46px;
      color: var(--muted);
      text-decoration: none;
    }

    .panel {
      padding: clamp(28px, 6vw, 48px);
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(242, 241, 236, 0.055);
    }

    h1 {
      max-width: 680px;
      margin: 0;
      font-size: clamp(46px, 8vw, 84px);
      line-height: 0.94;
      letter-spacing: -0.07em;
    }

    p {
      color: var(--muted);
      font-size: 18px;
    }

    form {
      display: grid;
      gap: 12px;
      margin-top: 26px;
    }

    label {
      color: rgba(242, 241, 236, 0.58);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      min-height: 48px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(13, 13, 12, 0.72);
      color: var(--paper);
      font: inherit;
    }

    .button {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 18px;
      border: 1px solid var(--paper);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
      font-size: 14px;
      font-weight: 900;
      text-decoration: none;
      cursor: pointer;
    }

    .button:disabled {
      cursor: wait;
      opacity: 0.62;
    }

    .status {
      min-height: 24px;
      color: var(--muted);
      font-size: 14px;
    }

    .warning {
      margin-top: 18px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: rgba(242, 241, 236, 0.62);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <a class="back" href="index.html">Back to i don't type</a>
    <section class="panel">
      <h1>Skool member checkout.</h1>
      <p>Enter the email you use for Skool. Stripe will run a free member checkout, then the success page will generate your Mac app license key.</p>
      <form id="member-checkout-form">
        <label for="email">Skool email</label>
        <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com">
        <button class="button plausible-event-name=Member+Checkout" id="submit" type="submit">Continue to free checkout</button>
        <div class="status" id="status" role="status"></div>
      </form>
      <p class="warning">This page only works from the private Skool member link. Do not share that link publicly.</p>
    </section>
  </main>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const token = params.get("token") || "";
      const form = document.getElementById("member-checkout-form");
      const email = document.getElementById("email");
      const status = document.getElementById("status");
      const submit = document.getElementById("submit");

      if (!token) {
        status.textContent = "This private member checkout link is missing or expired. Open the latest link from Skool.";
        submit.disabled = true;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        submit.disabled = true;
        status.textContent = "Opening Stripe checkout...";

        try {
          const response = await fetch("/.netlify/functions/create-member-checkout", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ email: email.value, token }),
          });
          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.error || "Could not start member checkout.");
          }
          window.location.href = data.url;
        } catch (error) {
          status.textContent = error.message;
          submit.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
